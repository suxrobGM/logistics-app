<div
  class="prose prose-sm dark:prose-invert max-w-none min-w-0"
  [class]="
    scale() === 'chat'
      ? 'prose-h1:text-lg prose-h2:text-base prose-h3:text-sm prose-headings:font-semibold prose-headings:mt-4 prose-headings:mb-1.5 prose-p:my-2 prose-ul:my-2 prose-ol:my-2 prose-li:my-0.5 text-sm'
      : ''
  "
  [class.line-clamp-3]="clamped()"
  [innerHTML]="content() | markdown"
></div>
