<hlm-autocomplete
  uiDetachedControl
  [value]="value()"
  (valueChange)="onValueChange($any($event))"
  (searchChange)="onSearch($event)"
  [itemToString]="itemToString"
  [disabled]="disabled() || readonly()"
  (closed)="onClosed()"
>
  <hlm-autocomplete-input
    [inputId]="id()"
    [placeholder]="placeholder() ?? ''"
    [showClear]="showClear()"
    [forceInvalid]="showInvalid()"
  />

  <hlm-autocomplete-content *hlmAutocompletePortal>
    <div hlmAutocompleteList>
      @for (option of suggestions(); track option) {
        <hlm-autocomplete-item [value]="$any(option)">{{ label(option) }}</hlm-autocomplete-item>
      }
    </div>
    <hlm-autocomplete-empty>No results found</hlm-autocomplete-empty>
  </hlm-autocomplete-content>
</hlm-autocomplete>
