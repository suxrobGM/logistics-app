<p-inputgroup>
  <hlm-select
    uiDetachedControl
    class="flex-none"
    [value]="selectedCountry()"
    (valueChange)="onCountryChange($any($event))"
    [itemToString]="countryDialCode"
    [disabled]="disabled()"
  >
    <hlm-select-trigger class="min-w-28 rounded-r-none">
      <hlm-select-value />
    </hlm-select-trigger>
    <hlm-select-content *hlmSelectPortal>
      @for (country of countries; track country.iso) {
        <hlm-select-item [value]="country">
          {{ country.dialCode }} {{ country.name }}
        </hlm-select-item>
      }
    </hlm-select-content>
  </hlm-select>
  <p-inputmask
    [mask]="currentMask()"
    [ngModel]="phoneNumber()"
    (ngModelChange)="onPhoneChange($event)"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (onBlur)="onBlur()"
    slotChar="_"
    [autoClear]="false"
  />
</p-inputgroup>
