<p-multiselect
  class="w-full"
  [id]="id()"
  [options]="options()"
  [optionLabel]="$any(optionLabel())"
  [optionValue]="$any(optionValue())"
  [placeholder]="$any(placeholder())"
  [showClear]="showClear()"
  [filter]="filter()"
  [filterBy]="filterBy()"
  [display]="display()"
  [maxSelectedLabels]="maxSelectedLabels()"
  [appendTo]="appendTo()"
  [disabled]="disabled()"
  [readonly]="readonly()"
  [required]="required()"
  [invalid]="showInvalid()"
  [ngModel]="value()"
  (ngModelChange)="value.set($event)"
  [ngModelOptions]="{ standalone: true }"
  (onBlur)="touch.emit()"
/>
