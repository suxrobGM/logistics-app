<p-datepicker
  [(ngModel)]="selected"
  selectionMode="range"
  [showIcon]="true"
  dateFormat="mm/dd/yy"
  placeholder="Select date range"
  [numberOfMonths]="2"
>
  <ng-template #footer>
    <div class="flex flex-wrap gap-2 border-t p-2">
      @for (preset of presets(); track preset.label) {
        <ui-button
          intent="secondary"
          appearance="text"
          size="sm"
          type="button"
          [label]="preset.label"
          (click)="selectPreset(preset)"
        />
      }
    </div>
  </ng-template>
</p-datepicker>
