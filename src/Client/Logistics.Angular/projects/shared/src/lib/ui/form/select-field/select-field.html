<p-select
  [options]="$any(options())"
  [ngModel]="value()"
  (ngModelChange)="value.set($event)"
  [ngModelOptions]="{ standalone: true }"
  [inputId]="id()"
  [optionLabel]="$any(optionLabel())"
  [optionValue]="$any(optionValue())"
  [placeholder]="$any(placeholder())"
  [showClear]="showClear()"
  [filter]="filter()"
  [appendTo]="appendTo()"
  [fluid]="fluid()"
  [styleClass]="$any(styleClass())"
  [filterPlaceholder]="$any(filterPlaceholder())"
  [filterBy]="$any(filterBy())"
  [loading]="loading()"
  [disabled]="disabled()"
  [readonly]="readonly()"
  [required]="required()"
  [invalid]="showInvalid()"
  (onBlur)="touch.emit()"
  (onChange)="selectionChange.emit($event.value)"
  (onClear)="cleared.emit()"
/>
