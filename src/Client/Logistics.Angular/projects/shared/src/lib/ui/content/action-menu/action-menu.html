@if (trigger() === "icon") {
  <ui-button
    [icon]="buttonIcon()"
    intent="secondary"
    appearance="text"
    [rounded]="true"
    [ariaLabel]="buttonLabel()"
    (click)="toggle($event)"
  />
} @else {
  <ui-button
    [label]="buttonLabel()"
    [icon]="buttonIcon()"
    intent="secondary"
    appearance="outlined"
    (click)="toggle($event)"
  />
}
<p-menu #menu [model]="menuItems()" [popup]="true" [appendTo]="appendToTarget()" />
