<p-inputgroup>
  <p-inputgroup-addon>{{ currency() }}</p-inputgroup-addon>
  <p-input-number
    [attr.id]="id() || null"
    [inputId]="$any(inputId())"
    [name]="name()"
    [ngModel]="value()"
    (ngModelChange)="value.set($event)"
    [ngModelOptions]="{ standalone: true }"
    [min]="min()"
    [max]="max()"
    [disabled]="disabled()"
    [readonly]="readonly()"
    [required]="required()"
    [invalid]="showInvalid()"
    [placeholder]="placeholder()"
    mode="decimal"
    [minFractionDigits]="2"
    [maxFractionDigits]="2"
    (onBlur)="touch.emit()"
  />
</p-inputgroup>
