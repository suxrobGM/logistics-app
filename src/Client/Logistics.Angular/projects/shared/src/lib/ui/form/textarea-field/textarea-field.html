<!-- Auto-grow makes the native resize gripper redundant; manual resize only fights it. -->
<textarea
  hlmTextarea
  class="w-full"
  [class.max-h-40]="capAutoGrow()"
  [class.resize-none]="capAutoGrow()"
  [id]="id()"
  [attr.name]="name() || null"
  [rows]="rows()"
  [value]="value()"
  [disabled]="disabled()"
  [readOnly]="readonly()"
  [required]="required()"
  [placeholder]="placeholder()"
  [attr.maxlength]="maxlength()"
  [attr.aria-invalid]="showInvalid() ? 'true' : null"
  (input)="onInput($event)"
  (blur)="touch.emit()"
></textarea>

@if (counter(); as c) {
  <div
    class="mt-1 block text-right font-sans text-xs"
    [class.text-muted-foreground]="!c.warn"
    [class.text-destructive]="c.warn"
  >
    {{ c.remaining }} / {{ c.max }}
  </div>
}
