<textarea
  hlmTextarea
  class="w-full"
  [id]="id()"
  [attr.name]="name() || null"
  [rows]="rows()"
  [value]="value()"
  [disabled]="disabled()"
  [readOnly]="readonly()"
  [required]="required()"
  [placeholder]="placeholder()"
  [attr.maxlength]="maxlength()"
  [attr.aria-invalid]="showInvalid() ? 'true' : null"
  (input)="onInput($event)"
  (blur)="touch.emit()"
></textarea>

@if (counterVisible()) {
  <div
    class="mt-1 text-right font-sans text-xs"
    [class.text-muted-foreground]="charsRemaining()! > counterWarnAt()"
    [class.text-destructive]="charsRemaining()! <= counterWarnAt()"
  >
    {{ charsRemaining() }} / {{ maxlength() }}
  </div>
}
