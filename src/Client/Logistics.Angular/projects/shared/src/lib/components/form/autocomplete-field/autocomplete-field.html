<p-autocomplete
  class="w-full"
  inputStyleClass="w-full"
  [suggestions]="$any(suggestions())"
  [ngModel]="value()"
  (ngModelChange)="value.set($event)"
  [ngModelOptions]="{ standalone: true }"
  [inputId]="id()"
  [optionLabel]="$any(optionLabel())"
  [placeholder]="$any(placeholder())"
  [minLength]="minQueryLength()"
  [delay]="delay()"
  [appendTo]="appendTo()"
  [fluid]="$any(fluid())"
  [styleClass]="$any(styleClass())"
  [forceSelection]="$any(forceSelection())"
  [showClear]="showClear()"
  [dropdown]="$any(dropdown())"
  [disabled]="disabled()"
  [readonly]="readonly()"
  [required]="required()"
  [invalid]="invalid()"
  [attr.name]="name() || null"
  (completeMethod)="completeMethod.emit($event)"
  (onSelect)="optionSelected.emit($event.value)"
  (onClear)="cleared.emit()"
  (onBlur)="touch.emit()"
/>
