<p-datepicker
  [ngModel]="value()"
  (ngModelChange)="value.set($event)"
  [ngModelOptions]="{ standalone: true }"
  [id]="id()"
  [inputId]="$any(inputId())"
  [selectionMode]="selectionMode()"
  [showIcon]="showIcon()"
  [dateFormat]="dateFormat()"
  [placeholder]="$any(placeholder())"
  [appendTo]="appendTo()"
  [fluid]="fluid()"
  [showTime]="showTime()"
  [timeOnly]="timeOnly()"
  [styleClass]="$any(styleClass())"
  [iconDisplay]="$any(iconDisplay())"
  [minDate]="minDate()"
  [maxDate]="maxDate()"
  [disabled]="disabled()"
  [readonlyInput]="readonly()"
  [required]="required()"
  [invalid]="invalid()"
  (onBlur)="touch.emit()"
  (onSelect)="dateSelected.emit($event)"
/>
