<p-select
  [options]="$any(options())"
  [ngModel]="value()"
  (ngModelChange)="value.set($event)"
  [ngModelOptions]="{ standalone: true }"
  [inputId]="id()"
  [optionLabel]="optionLabel()"
  [optionValue]="optionValue()"
  [placeholder]="placeholder()"
  [showClear]="showClear()"
  [filter]="filter()"
  [appendTo]="appendTo()"
  [fluid]="fluid()"
  [disabled]="disabled()"
  [readonly]="readonly()"
  [required]="required()"
  [invalid]="invalid()"
  (onBlur)="touch.emit()"
/>
