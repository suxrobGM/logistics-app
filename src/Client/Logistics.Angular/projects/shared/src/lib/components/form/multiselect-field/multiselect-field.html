<p-multiselect
  class="w-full"
  [id]="id()"
  [options]="options()"
  [optionLabel]="optionLabel()"
  [optionValue]="optionValue()"
  [placeholder]="placeholder()"
  [showClear]="showClear()"
  [filter]="filter()"
  [filterBy]="filterBy()"
  [display]="display()"
  [maxSelectedLabels]="maxSelectedLabels()"
  [appendTo]="appendTo()"
  [disabled]="disabled()"
  [readonly]="readonly()"
  [required]="required()"
  [invalid]="invalid()"
  [ngModel]="value()"
  (ngModelChange)="value.set($event)"
  [ngModelOptions]="{ standalone: true }"
  (onBlur)="touch.emit()"
/>
