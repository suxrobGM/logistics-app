<p-password
  [ngModel]="value()"
  (ngModelChange)="value.set($event)"
  [ngModelOptions]="{ standalone: true }"
  [inputId]="id()"
  [attr.name]="name() || null"
  [placeholder]="$any(placeholder())"
  [feedback]="feedback()"
  [toggleMask]="$any(toggleMask())"
  [fluid]="$any(fluid())"
  [styleClass]="$any(styleClass())"
  [inputStyleClass]="$any(inputStyleClass())"
  [disabled]="disabled()"
  [required]="required()"
  [invalid]="invalid()"
  (onBlur)="touch.emit()"
  (onClear)="cleared.emit()"
/>
