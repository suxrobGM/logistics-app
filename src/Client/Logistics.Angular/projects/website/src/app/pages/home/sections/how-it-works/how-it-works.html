<web-section-container sectionId="how-it-works" background="dark">
  <div webScrollAnimate="fade-up">
    <web-section-header
      label="How It Works"
      title="Set it up yourself"
      subtitle="Four steps from a fresh account to AI dispatch. The checklist is in the app - there's no onboarding call to book."
      [dark]="true"
    />
  </div>

  <div class="mt-16 grid gap-8 md:grid-cols-4">
    @for (step of steps; track step.number; let i = $index) {
      <div webScrollAnimate="fade-up" [delay]="i * 150" class="relative text-center">
        <!-- Connector Line (hidden on last item and mobile) -->
        @if (step.number < 4) {
          <div
            class="bg-accent absolute top-12 left-1/2 hidden h-0.5 w-full opacity-30 md:block"
          ></div>
        }

        <!-- Step Circle -->
        <div class="relative mx-auto w-fit">
          <web-icon-circle [icon]="step.icon" size="lg" />
          <div
            class="bg-paper text-accent absolute -top-1 -right-1 flex h-7 w-7 items-center justify-center rounded-full text-sm font-bold"
          >
            {{ step.number }}
          </div>
        </div>

        <!-- Content -->
        <h3 class="font-display text-paper mt-6 text-xl font-semibold">{{ step.title }}</h3>
        <p class="text-steel mt-2">{{ step.description }}</p>
      </div>
    }
  </div>
</web-section-container>
