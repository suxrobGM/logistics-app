<div class="border-border relative flex items-end gap-2 border-t p-3">
  @if (commandSuggestions().length > 0) {
    <div
      class="border-border bg-elevated absolute right-3 bottom-full left-3 z-10 mb-1 overflow-hidden rounded-md border shadow-md"
      role="listbox"
      aria-label="Chat commands"
    >
      @for (cmd of commandSuggestions(); track cmd.name; let i = $index) {
        <button
          type="button"
          role="option"
          class="hover:bg-hover flex w-full cursor-pointer items-baseline gap-2 px-3 py-2 text-left text-sm"
          [class.bg-hover]="i === activeIndex()"
          [attr.aria-selected]="i === activeIndex()"
          (mousedown)="$event.preventDefault(); runCommand(cmd)"
        >
          <span class="font-medium">/{{ cmd.name }}</span>
          <span class="text-muted-foreground text-xs">{{ cmd.description }}</span>
        </button>
      }
    </div>
  }

  <ui-textarea-field
    [(value)]="text"
    [rows]="2"
    [maxlength]="4000"
    [disabled]="blocked()"
    [placeholder]="placeholder()"
    capAutoGrow
    (keydown)="onKeydown($event)"
    (touch)="dismissSuggestions()"
    class="block min-w-0 flex-1 text-sm"
  />
  @if (isRunning()) {
    <ui-button
      icon="stop-circle"
      intent="danger"
      appearance="outlined"
      [rounded]="true"
      ariaLabel="Stop the running turn"
      (click)="stopTurn.emit()"
    />
  } @else {
    <ui-button
      icon="send"
      [rounded]="true"
      [loading]="disabled()"
      [disabled]="blocked()"
      ariaLabel="Send message"
      (click)="submit()"
    />
  }
</div>
