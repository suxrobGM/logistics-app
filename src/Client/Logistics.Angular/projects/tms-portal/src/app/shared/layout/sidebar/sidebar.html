<div class="sidebar" [class.minimized]="collapsed()">
  <app-brand-header [collapsed]="collapsed()" />

  <app-search-trigger [collapsed]="collapsed()" />

  <app-favorites-bar [collapsed]="collapsed()" />

  <app-nav-menu [collapsed]="collapsed()" />

  <button
    class="sidebar-toggle"
    (click)="toggle()"
    [uiTooltip]="collapsed() ? 'Maximize menu' : 'Minimize menu'"
    uiTooltipPosition="right"
    type="button"
  >
    <ui-icon
      [name]="collapsed() ? 'chevron-right' : 'chevron-left'"
      size="inherit"
      class="text-xs"
    />
    @if (!collapsed()) {
      <span>Collapse</span>
    }
  </button>

  <div class="sidebar-footer" [class.sidebar-footer-collapsed]="collapsed()">
    <div class="nav-footer-actions">
      <app-notification-bell />
      <app-copilot-launcher />
      <app-theme-toggle />
    </div>

    <app-user-menu compact [labelsHidden]="collapsed()" />
  </div>
</div>
