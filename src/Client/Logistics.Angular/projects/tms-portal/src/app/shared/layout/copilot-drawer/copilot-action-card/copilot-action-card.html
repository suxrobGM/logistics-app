<div class="border-border bg-muted/40 rounded-lg border p-3">
  <div class="flex items-center justify-between gap-2">
    <div class="flex min-w-0 items-center gap-2">
      <ui-icon [name]="icon()" size="inherit" class="text-primary shrink-0 text-sm" />
      <span class="truncate text-sm font-medium">{{ label() }}</span>
    </div>
    <ui-badge
      [value]="decision().status ?? ''"
      [severity]="Labels.dispatchStatusSeverity(decision().status ?? '')"
    />
  </div>

  @if (decision().reasoning) {
    <p class="text-muted-foreground mt-2 mb-0 line-clamp-3 text-xs">{{ decision().reasoning }}</p>
  }

  @if (isPending()) {
    <ui-permission-guard [permissions]="copilotManage">
      <div class="mt-3">
        <app-approve-reject-actions
          [decision]="decision()"
          (approve)="approve.emit($event)"
          (reject)="reject.emit($event)"
        />
      </div>
    </ui-permission-guard>
  }
</div>
