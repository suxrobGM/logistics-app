@switch (message().role) {
  @case ("user") {
    <div class="flex flex-col items-end gap-1">
      @if (sender(); as name) {
        <span class="text-muted-foreground px-1 text-xs">{{ name }}</span>
      }
      <div class="bg-primary/10 max-w-[85%] rounded-lg px-3 py-2 text-sm whitespace-pre-wrap">
        {{ message().text }}
      </div>
    </div>
  }
  @case ("system") {
    <div
      class="text-muted-foreground flex items-center justify-center gap-2 px-1 text-center text-xs"
    >
      <ui-icon name="info" size="inherit" />
      <span>{{ message().text }}</span>
      @if (sender(); as name) {
        <span>&middot; {{ name }}</span>
      }
    </div>
  }
  @default {
    <div class="flex items-start gap-2">
      <div
        class="bg-primary/10 text-primary mt-0.5 flex size-6 shrink-0 items-center justify-center rounded-full"
      >
        <ui-icon name="bot" size="inherit" class="text-xs" />
      </div>
      <ui-markdown class="flex-1" scale="chat" [content]="message().text" />
    </div>
  }
}
