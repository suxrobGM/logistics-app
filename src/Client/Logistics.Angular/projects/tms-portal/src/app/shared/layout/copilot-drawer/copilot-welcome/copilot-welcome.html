<div class="text-muted-foreground px-2 py-6 text-center text-sm">
  <p class="m-0 font-medium">What can I help with?</p>
  <div class="mt-3 flex flex-wrap justify-center gap-2">
    @for (prompt of suggestedPrompts; track prompt) {
      <ui-button
        [label]="prompt"
        appearance="outlined"
        intent="secondary"
        size="sm"
        [rounded]="true"
        (click)="promptSelected.emit(prompt)"
      />
    }
  </div>
</div>
