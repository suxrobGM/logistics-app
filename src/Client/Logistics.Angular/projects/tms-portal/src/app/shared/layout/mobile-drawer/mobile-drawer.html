<ui-drawer
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  position="left"
  width="300px"
>
  <app-brand-header uiDrawerHeader inline />

  <nav class="bg-surface flex h-full flex-col">
    <app-search-trigger (triggered)="closeMenu()" />

    <app-favorites-bar (navigate)="closeMenu()" />

    <app-nav-menu (itemClick)="closeMenu()" />

    <div class="border-subtle border-t px-4 py-3">
      <div class="nav-footer-actions pb-2.5">
        <app-notification-bell />
        <app-copilot-launcher (triggered)="closeMenu()" />
        <app-theme-toggle />
      </div>

      <app-user-menu />
    </div>
  </nav>
</ui-drawer>
