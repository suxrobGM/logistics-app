<ui-stack gap="2" class="p-3">
  <ui-button
    label="New chat"
    icon="plus"
    appearance="outlined"
    size="sm"
    (click)="newChat.emit()"
  />

  @if (loading() && conversations().length === 0) {
    <ui-stack
      direction="row"
      align="center"
      gap="2"
      class="text-muted-foreground px-1 py-2 text-xs"
    >
      <ui-spinner size="1em" ariaLabel="Loading conversations" />
      Loading conversations...
    </ui-stack>
  }

  @for (conversation of conversations(); track conversation.id) {
    <div
      class="border-border hover:bg-hover group relative flex w-full items-center gap-2 rounded-md border p-2 text-left"
      [class.bg-hover]="conversation.id === currentConversationId()"
      [class.border-primary]="conversation.id === currentConversationId()"
    >
      <!-- Stretched over the row instead of wrapping it: a <button> may not contain the kebab button. -->
      <button
        type="button"
        class="absolute inset-0 cursor-pointer rounded-md bg-transparent"
        [attr.aria-label]="'Open ' + (conversation.title || 'New conversation')"
        (click)="open.emit(conversation.id!)"
      ></button>

      <ui-icon name="bot-message-square" size="inherit" class="text-muted-foreground shrink-0" />
      <div class="min-w-0 flex-1">
        <ui-typography variant="body-sm" class="truncate">
          {{ conversation.title || "New conversation" }}
        </ui-typography>
        <ui-typography variant="caption" color="muted">
          {{ conversation.lastMessageAt | date: "MMM d, HH:mm" }}
        </ui-typography>
      </div>
      <ui-button
        class="relative"
        icon="ellipsis-vertical"
        appearance="text"
        intent="secondary"
        size="sm"
        ariaLabel="Conversation actions"
        (click)="menuTarget.set(conversation); menu.toggle($event)"
      />
    </div>
  } @empty {
    @if (!loading()) {
      <ui-empty-state
        icon="bot-message-square"
        title="No conversations yet"
        message="Start a chat and it will show up here."
      />
    }
  }

  @if (hasMore()) {
    <ui-button
      label="Load more"
      appearance="text"
      intent="secondary"
      size="sm"
      (click)="loadMore.emit()"
    />
  }
</ui-stack>

<ui-menu #menu [items]="menuItems()" />

<ui-dialog
  header="Rename conversation"
  width="22rem"
  [open]="renameTarget() !== null"
  (closed)="closeRenameDialog()"
>
  <ui-text-field
    [id]="renameFieldId"
    [(value)]="renameTitle"
    [maxlength]="120"
    placeholder="Conversation title"
    (keydown.enter)="confirmRename()"
  />
  <ui-stack direction="row" justify="end" gap="2" class="mt-4">
    <ui-button
      label="Cancel"
      appearance="outlined"
      intent="secondary"
      size="sm"
      (click)="closeRenameDialog()"
    />
    <ui-button
      label="Rename"
      size="sm"
      [disabled]="!renameTitle().trim()"
      (click)="confirmRename()"
    />
  </ui-stack>
</ui-dialog>
