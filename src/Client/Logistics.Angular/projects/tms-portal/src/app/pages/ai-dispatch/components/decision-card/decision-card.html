<ui-surface variant="elevated" [border]="true">
  <!-- Header -->
  <ui-stack direction="row" align="center" justify="between" class="mb-3">
    <ui-stack direction="row" align="center" gap="2">
      <ui-badge [value]="Labels.decisionTypeLabel(decision().type ?? '')" severity="info" />
      <ui-badge
        [value]="decision().status ?? ''"
        [severity]="Labels.dispatchStatusSeverity(decision().status ?? '')"
      />
    </ui-stack>
    <ui-typography variant="caption" color="muted">{{ toolLabel() }}</ui-typography>
  </ui-stack>

  <!-- Reasoning -->
  @if (decision().reasoning) {
    <ui-typography variant="body-sm" color="secondary" class="mb-3 line-clamp-3 leading-relaxed">
      {{ stripMarkdown(decision().reasoning) }}
    </ui-typography>
  }

  <!-- Tool input details -->
  @if (refs().load) {
    <ui-surface variant="subtle" padding="sm" radius="md" [border]="false" class="mb-3 text-sm">
      <ui-stack direction="row" align="center" gap="2">
        <ui-icon name="box" size="xs" color="muted" />
        <span class="text-muted-foreground">Load:</span>
        <span class="font-semibold">{{ refs().load }}</span>
      </ui-stack>
      @if (refs().truck) {
        <ui-stack direction="row" align="center" gap="2" class="mt-1">
          <ui-icon name="truck" size="xs" color="muted" />
          <span class="text-muted-foreground">Truck:</span>
          <span class="font-semibold">{{ refs().truck }}</span>
        </ui-stack>
      }
      @if (refs().reasoning) {
        <ui-typography variant="caption" color="secondary" class="mt-2 block italic">
          "{{ refs().reasoning }}"
        </ui-typography>
      }
    </ui-surface>
  }

  <!-- Actions -->
  @if (decision().status === "suggested") {
    <ui-stack direction="row" gap="2">
      <ui-button
        intent="success"
        appearance="outlined"
        size="sm"
        label="Approve"
        icon="check"
        [loading]="busy()"
        (click)="onApprove()"
      />
      <ui-button
        intent="danger"
        appearance="outlined"
        size="sm"
        label="Reject"
        icon="x"
        [disabled]="busy()"
        (click)="onReject()"
      />
    </ui-stack>
  }
</ui-surface>
