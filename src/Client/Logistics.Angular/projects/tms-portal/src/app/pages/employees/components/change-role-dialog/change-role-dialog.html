<p-dialog
  header="Update Employee's Role"
  [(visible)]="visible"
  [modal]="true"
  [resizable]="true"
  (onHide)="close()"
>
  @if (isLoading() || form().submitting()) {
    <p-progress-spinner />
  }

  <p>
    Are you sure that you want to change employee's role? <br />
    If you want to remove role from employee then select <strong>Remove Role</strong>.
  </p>

  <form [formRoot]="form">
    <div class="mb-3">
      <label for="role" class="form-label">Select Role</label>
      <ui-select-field
        [formField]="form.role"
        appendTo="body"
        [options]="roles()"
        optionValue="name"
        optionLabel="displayName"
        [showClear]="true"
        (cleared)="clearSelectedRole()"
      />
    </div>
    <div class="flex gap-2">
      <p-button
        type="submit"
        icon="pi pi-pencil"
        label="Change Role"
        [loading]="form().submitting()"
        [disabled]="isLoading()"
      />
      <p-button
        type="button"
        icon="pi pi-trash"
        label="Remove Role"
        [disabled]="isLoading() || form().submitting()"
        (click)="removeRole()"
      />
    </div>
  </form>
</p-dialog>
