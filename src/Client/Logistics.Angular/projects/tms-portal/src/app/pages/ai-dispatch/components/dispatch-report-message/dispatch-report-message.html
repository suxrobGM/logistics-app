<ui-surface variant="elevated" padding="lg">
  <div class="mb-2 flex items-center gap-2">
    <span
      class="bg-primary/10 text-primary flex size-6 shrink-0 items-center justify-center rounded-full"
    >
      <ui-icon name="sparkles" size="inherit" class="text-xs" />
    </span>
    <span class="text-sm font-semibold">Dispatch summary</span>
  </div>

  <div
    class="prose prose-sm dark:prose-invert prose-h1:text-lg prose-h2:text-base prose-h3:text-sm prose-headings:font-semibold prose-headings:mt-4 prose-headings:mb-1.5 prose-p:my-2 prose-ul:my-2 prose-ol:my-2 prose-li:my-0.5 max-w-none min-w-0 text-sm"
    [innerHTML]="message().text | markdown"
  ></div>

  @if (session()?.totalTokensUsed; as tokens) {
    <div class="text-muted-foreground mt-3 text-xs">{{ tokens | number }} tokens</div>
  }
</ui-surface>
