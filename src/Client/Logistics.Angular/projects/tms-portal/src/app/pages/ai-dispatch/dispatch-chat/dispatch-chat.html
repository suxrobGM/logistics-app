<div class="flex h-[calc(100dvh-5rem)] flex-col md:h-[calc(100dvh-2rem)]">
  <ui-stack
    direction="row"
    align="center"
    justify="between"
    gap="2"
    tag="header"
    class="border-border mb-3 shrink-0 border-b pb-2"
  >
    <ui-stack direction="row" align="center" gap="1" class="min-w-0">
      <ui-button
        icon="history"
        appearance="text"
        intent="secondary"
        size="sm"
        ariaLabel="Conversations"
        uiTooltip="Conversations"
        (click)="store.toggleSidebar()"
      />
      <ui-button
        icon="square-pen"
        appearance="text"
        intent="secondary"
        size="sm"
        ariaLabel="New chat"
        uiTooltip="New chat"
        (click)="newChat()"
      />
      <ui-icon name="sparkles" size="inherit" class="text-primary ml-1" />
      <ui-typography
        variant="h6"
        tag="h1"
        class="min-w-0 [&>h1]:mb-0 [&>h1]:truncate"
        [uiTooltip]="store.currentConversation()?.title ?? undefined"
      >
        {{ store.currentConversation()?.title || "AI Dispatch" }}
      </ui-typography>
    </ui-stack>

    <ui-stack direction="row" align="center" gap="2" class="shrink-0">
      <ui-button
        label="Plan assignments"
        icon="zap"
        size="sm"
        ariaLabel="Plan assignments"
        buttonClass="max-sm:[&>span]:hidden"
        [disabled]="store.isRunning() || store.quotaBlocked()"
        (click)="store.sendMessage(planAssignmentsPrompt)"
      />
      <ui-button
        icon="sliders-horizontal"
        appearance="outlined"
        intent="secondary"
        size="sm"
        ariaLabel="Dispatch policy"
        uiTooltip="Dispatch policy"
        [routerLink]="['/ai-dispatch', 'policy']"
      />
      <ui-button
        icon="panel-right"
        appearance="text"
        intent="secondary"
        size="sm"
        ariaLabel="Toggle side panel"
        uiTooltip="Toggle side panel"
        (click)="store.toggleRightPanel()"
      />
    </ui-stack>
  </ui-stack>

  <div class="flex min-h-0 flex-1 gap-4">
    <div class="flex min-w-0 flex-1 flex-col">
      <app-dispatch-transcript />

      <div
        class="border-border bg-card mx-auto mt-3 w-full max-w-3xl overflow-hidden rounded-xl border shadow-sm"
      >
        <app-quota-notice class="border-b" [notice]="store.quotaNotice()" />

        <app-realtime-banner
          class="border-border border-b"
          [visible]="store.realtimeDown()"
          (retry)="store.reconnect()"
        />

        <app-chat-composer
          [isRunning]="store.isRunning()"
          [disabled]="store.sending()"
          [blocked]="store.quotaBlocked()"
          placeholder="Ask the dispatcher agent to plan assignments, check hours, or find loads..."
          (sendMessage)="store.sendMessage($event)"
          (stopTurn)="store.cancelTurn()"
        />
      </div>
    </div>

    @if (!layoutService.isMobile() && !store.rightPanelCollapsed()) {
      <aside class="w-80 shrink-0 xl:w-88">
        <app-dispatch-right-panel />
      </aside>
    }
  </div>
</div>

<ui-drawer
  position="left"
  width="320px"
  header="Conversations"
  [visible]="!store.sidebarCollapsed()"
  (visibleChange)="store.setSidebarCollapsed(!$event)"
>
  <app-conversation-list
    [conversations]="store.conversations()"
    [currentConversationId]="store.currentConversation()?.id ?? null"
    [hasMore]="store.hasMoreHistory()"
    [loading]="store.loading()"
    (open)="selectConversation($event)"
    (newChat)="newChat()"
    (rename)="store.renameConversation($event.id, $event.title)"
    (delete)="store.deleteConversation($event)"
    (loadMore)="store.loadMoreConversations()"
  />
</ui-drawer>

@if (layoutService.isMobile()) {
  <ui-drawer
    position="right"
    width="360px"
    header="Fleet & decisions"
    [visible]="!store.rightPanelCollapsed()"
    (visibleChange)="store.setRightPanelCollapsed(!$event)"
  >
    <app-dispatch-right-panel />
  </ui-drawer>
}

<app-reject-decision-dialog />
