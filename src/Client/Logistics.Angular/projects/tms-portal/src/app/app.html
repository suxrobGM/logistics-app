@if (showAuthLoading()) {
  <div class="auth-loading-container">
    <div class="auth-loading-card">
      <ui-spinner />
      <p class="auth-loading-text">Loading your workspace...</p>
    </div>
  </div>
} @else if (showLayout()) {
  <!-- Mobile Drawer (slides in from left) -->
  <app-mobile-drawer />

  <div class="flex h-dvh flex-col overflow-hidden">
    <ui-license-banner />

    <!-- Mobile Header (visible only on mobile) -->
    <app-mobile-header />

    <div class="flex min-h-0 flex-1">
      <!-- Desktop Sidebar (hidden on mobile) -->
      <div class="hidden md:block">
        <app-sidebar />
      </div>

      <div class="relative min-w-0 flex-1 overflow-y-auto">
        <div [class.p-2]="layoutService.isMobile()" [class.p-4]="!layoutService.isMobile()">
          <router-outlet />
        </div>
      </div>

      <app-copilot-drawer />
    </div>
  </div>
} @else {
  <router-outlet />
}

<ui-toaster />
<app-command-palette />
<app-upgrade-dialog />
