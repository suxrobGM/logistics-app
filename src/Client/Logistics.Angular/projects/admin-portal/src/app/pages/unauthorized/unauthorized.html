<div class="flex min-h-screen items-center justify-center bg-gray-100">
  <ui-card class="w-full max-w-md shadow-lg">
    <div class="text-center">
      <div class="mb-6">
        <ui-icon name="lock" size="inherit" class="text-6xl text-orange-500" />
      </div>

      <h1 class="mb-2 text-2xl font-bold text-gray-800">Access Denied</h1>
      <p class="mb-6 text-gray-600">
        You don't have permission to access this page. Please contact your administrator if you
        believe this is an error.
      </p>

      <div class="flex justify-center gap-3">
        <ui-button label="Go to Login" icon="arrow-left" routerLink="/" />
        <ui-button intent="secondary" label="Sign Out" icon="log-out" (click)="logout()" />
      </div>
    </div>
  </ui-card>
</div>
