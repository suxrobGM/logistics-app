<header
  class="sticky top-0 z-40 flex items-center justify-between border-b border-gray-200 bg-white px-4 py-3 md:hidden"
>
  <!-- size="lg" rather than the old `styleClass="text-xl"`: ui-button sizes its glyph from the size
       variant (lg = 1.25rem), which is exactly what the old text-xl gave the primeicons glyph. -->
  <ui-button
    [icon]="mobileMenuOpen() ? 'times' : 'bars'"
    appearance="text"
    size="lg"
    (click)="toggleMenu()"
    ariaLabel="Toggle navigation menu"
  />

  <span class="text-primary text-lg font-semibold">Admin Portal</span>

  <div class="w-10"></div>
</header>
