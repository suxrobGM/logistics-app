name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Contributor License Agreement
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/suxrobGM/logistics-app/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: suxrobgm,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: "Thank you for the pull request. Before it can be merged, please read the [Contributor License Agreement](https://github.com/suxrobGM/logistics-app/blob/main/CLA.md) and sign it by posting the sentence below as a comment."
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA."
          lock-pullrequest-aftermerge: false
