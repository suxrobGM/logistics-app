name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PRESENTATION_PROJECTS_DIR: ./src/Presentation

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      # The clients live in a private submodule. This build must pass without them,
      # which is what proves the public repo still stands on its own.
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      #- name: Install dependencies
      #  run: dotnet restore

      #- name: Verify formatting
      #  run: dotnet format --verify-no-changes --no-restore

      - name: Build Web API
        run: dotnet build ${{ env.PRESENTATION_PROJECTS_DIR }}/Logistics.API/Logistics.API.csproj

      - name: Build Identity Server
        run: dotnet build ${{ env.PRESENTATION_PROJECTS_DIR }}/Logistics.IdentityServer/Logistics.IdentityServer.csproj

      - name: Build License Issuer
        run: dotnet build tools/Logistics.LicenseIssuer/Logistics.LicenseIssuer.csproj

      - name: Run tests
        run: dotnet test Logistics.slnx
